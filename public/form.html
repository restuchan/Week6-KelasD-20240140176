<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SegarMart - Pembuat Caption</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/form.css">
</head>
<body>

  <nav>
    <a class="brand" href="index.html">SegarMart</a>
    <div class="links">
      <a href="index.html">Etalase</a>
      <a href="form.html" aria-current="page">Caption</a>
    </div>
  </nav>

  <header>
    <h1>Caption jualan,<br>jadi dalam sekali klik.</h1>
    <p>Isi nama produk dan harga, pilih gaya bahasa, lalu salin hasilnya ke media sosial.</p>
  </header>

  <main class="studio">
    <form id="form" novalidate>
      <h2>Detail produk</h2>
      <p id="prefill" class="notice" hidden>Terisi otomatis dari Etalase. Ubah bila perlu.</p>

      <label for="nama">Nama produk</label>
      <input type="text" id="nama" placeholder="Contoh: Madu Hutan Murni" aria-describedby="nama-error">
      <small class="error" id="nama-error" aria-live="polite"></small>

      <label for="harga">Harga (Rp)</label>
      <input type="number" id="harga" placeholder="Contoh: 25000" aria-describedby="harga-hint harga-error">
      <small class="hint" id="harga-hint"></small>
      <small class="error" id="harga-error" aria-live="polite"></small>

      <label for="template">Gaya caption</label>
      <select id="template">
        <option value="promo">Promo, heboh dan mengajak beli</option>
        <option value="santai">Santai, akrab seperti teman</option>
        <option value="formal">Formal, rapi dan profesional</option>
      </select>

      <button type="submit" class="primary">Buat caption</button>
    </form>

    <section class="result">
      <h2>Hasil caption</h2>
      <label for="caption">Caption siap pakai</label>
      <textarea id="caption" readonly placeholder="Captionmu akan muncul di sini."></textarea>
      <button type="button" id="copyBtn" class="secondary" disabled>Salin caption</button>
    </section>
  </main>

  <footer>SegarMart, pembuat caption dengan HTML, CSS, dan JavaScript native</footer>

<script src="js/form.js"></script>
</body>
</html>
